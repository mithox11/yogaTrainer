<div class="hero-section">
  <div class="hero-content">
    <mat-icon class="hero-icon">self_improvement</mat-icon>
    <h2>Welcome to Yoga Trainer</h2>
    <p>Choose your preferred style and let us generate a perfectly balanced routine just for you.</p>
    
    <div class="random-buttons">
      <button mat-raised-button color="primary" class="yoga-btn" (click)="generateRandomRoutine('Vinyasa')">
        <mat-icon>waves</mat-icon>
        Vinyasa Flow
      </button>
      <button mat-raised-button color="accent" class="yoga-btn" (click)="generateRandomRoutine('Hatha')">
        <mat-icon>wb_sunny</mat-icon>
        Hatha Yoga
      </button>
      <button mat-raised-button color="warn" class="yoga-btn" (click)="generateRandomRoutine('Yin Yoga')">
        <mat-icon>nights_stay</mat-icon>
        Yin Yoga
      </button>
    </div>
  </div>
</div>
