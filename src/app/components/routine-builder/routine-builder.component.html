<mat-card class="builder-card mat-elevation-z4">
  <mat-card-header>
    <mat-card-title>Create Your Routine</mat-card-title>
    <mat-card-subtitle>Select your preferences below to generate a custom flow.</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content class="form-content">
    
    <mat-form-field appearance="fill">
      <mat-label>Select Routine</mat-label>
      <mat-select [(ngModel)]="selectedRoutineId">
        <mat-optgroup *ngFor="let group of groupedRoutines" [label]="group.goal">
          <mat-option *ngFor="let routine of group.routines" [value]="routine.id">
            {{routine.title}} ({{routine.durationMinutes}} min)
          </mat-option>
        </mat-optgroup>
      </mat-select>
    </mat-form-field>

  </mat-card-content>
  <mat-card-actions align="end">
    <button mat-raised-button color="primary" (click)="generateRoutine()">Generate Routine</button>
  </mat-card-actions>
</mat-card>
