<div class="hero-section">
  <div class="hero-content">
    <mat-icon class="hero-icon">self_improvement</mat-icon>
    <h2>Welcome to Yoga Trainer</h2>
    <p>Choose your preferred style for a quick routine, or select from the full curated master catalog.</p>
    
    <!-- Quick Flow by Style -->
    <div class="random-buttons">
      <button mat-raised-button class="yoga-btn vinyasa-btn" (click)="generateRandomRoutine('Vinyasa')">
        <mat-icon>waves</mat-icon>
        Vinyasa Flow
      </button>
      <button mat-raised-button class="yoga-btn hatha-btn" (click)="generateRandomRoutine('Hatha')">
        <mat-icon>wb_sunny</mat-icon>
        Hatha Yoga
      </button>
      <button mat-raised-button class="yoga-btn yin-btn" (click)="generateRandomRoutine('Yin Yoga')">
        <mat-icon>nights_stay</mat-icon>
        Yin Yoga
      </button>
    </div>

    <!-- Divider -->
    <div class="divider-row">
      <span class="divider-line"></span>
      <span class="divider-text">o elige una rutina de la colección</span>
      <span class="divider-line"></span>
    </div>

    <!-- Curated Master Routines Catalog Selector -->
    <div class="curated-selector-container" *ngIf="routines.length > 0">
      <mat-form-field appearance="outline" class="routine-select-field">
        <mat-label>Colección Completa ({{routines.length}} rutinas)</mat-label>
        <mat-select [(ngModel)]="selectedRoutineId">
          <mat-optgroup *ngFor="let group of groupedRoutines" [label]="group.goal">
            <mat-option *ngFor="let r of group.routines" [value]="r.id">
              {{r.title}} &bull; {{r.durationMinutes}} min ({{r.level}})
            </mat-option>
          </mat-optgroup>
        </mat-select>
      </mat-form-field>

      <button mat-raised-button class="start-curated-btn" (click)="startSelectedRoutine()">
        <mat-icon>play_circle</mat-icon>
        Comenzar Rutina
      </button>
    </div>

  </div>
</div>
